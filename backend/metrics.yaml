version: "1.0"
namespace: enterprise_analytics
table: fact_sales

metrics:
  revenue:
    name: Revenue
    description: Total recognized sales revenue from all fulfilled orders
    formula: SUM(revenue)
    sql_expression: "SUM(revenue)"
    format: currency
    governance: approved
    owner: Finance
    allowed_dimensions:
      - region
      - sub_region
      - product_category
      - quarter
      - month
      - sales_channel
      - customer_segment

  cogs:
    name: Cost of Goods Sold
    description: Direct costs attributable to goods sold including manufacturing and procurement
    formula: SUM(cogs)
    sql_expression: "SUM(cogs)"
    format: currency
    governance: approved
    owner: Operations
    allowed_dimensions:
      - region
      - sub_region
      - product_category
      - quarter
      - month
      - sales_channel
      - customer_segment

  gross_margin:
    name: Gross Margin
    description: Revenue minus cost of goods sold
    formula: SUM(revenue) - SUM(cogs)
    sql_expression: "(SUM(revenue) - SUM(cogs))"
    format: currency
    governance: approved
    owner: Finance
    allowed_dimensions:
      - region
      - sub_region
      - product_category
      - quarter
      - month
      - sales_channel
      - customer_segment

  gross_margin_pct:
    name: Gross Margin %
    description: Gross margin as a percentage of revenue
    formula: (SUM(revenue) - SUM(cogs)) / NULLIF(SUM(revenue), 0) * 100
    sql_expression: "ROUND((SUM(revenue) - SUM(cogs)) * 100.0 / NULLIF(SUM(revenue), 0), 2)"
    format: percentage
    governance: approved
    owner: Finance
    allowed_dimensions:
      - region
      - sub_region
      - product_category
      - quarter
      - month
      - sales_channel
      - customer_segment

  shipping_cost:
    name: Shipping Cost
    description: Total freight, logistics, and distribution costs
    formula: SUM(shipping_cost)
    sql_expression: "SUM(shipping_cost)"
    format: currency
    governance: approved
    owner: Logistics
    allowed_dimensions:
      - region
      - sub_region
      - product_category
      - quarter
      - month
      - sales_channel

  material_cost:
    name: Material Cost
    description: Raw materials and component procurement costs
    formula: SUM(material_cost)
    sql_expression: "SUM(material_cost)"
    format: currency
    governance: approved
    owner: Procurement
    allowed_dimensions:
      - region
      - sub_region
      - product_category
      - quarter
      - month

  ad_spend:
    name: Advertising Spend
    description: Total marketing and advertising expenditure
    formula: SUM(ad_spend)
    sql_expression: "SUM(ad_spend)"
    format: currency
    governance: approved
    owner: Marketing
    allowed_dimensions:
      - region
      - sub_region
      - product_category
      - quarter
      - month
      - sales_channel

  order_count:
    name: Order Count
    description: Total number of customer orders
    formula: COUNT(DISTINCT order_id)
    sql_expression: "COUNT(DISTINCT order_id)"
    format: number
    governance: approved
    owner: Sales
    allowed_dimensions:
      - region
      - sub_region
      - product_category
      - quarter
      - month
      - sales_channel
      - customer_segment

  avg_order_value:
    name: Average Order Value
    description: Average revenue per order
    formula: SUM(revenue) / COUNT(DISTINCT order_id)
    sql_expression: "ROUND(SUM(revenue) * 1.0 / NULLIF(COUNT(DISTINCT order_id), 0), 2)"
    format: currency
    governance: approved
    owner: Sales
    allowed_dimensions:
      - region
      - sub_region
      - product_category
      - quarter
      - month
      - sales_channel
      - customer_segment

  churn_rate:
    name: Customer Churn Rate
    description: Percentage of customers lost during the period
    formula: SUM(churned_customers) / NULLIF(SUM(total_customers), 0) * 100
    sql_expression: "ROUND(SUM(churned_customers) * 100.0 / NULLIF(SUM(total_customers), 0), 2)"
    format: percentage
    governance: approved
    owner: Customer Success
    allowed_dimensions:
      - region
      - sub_region
      - product_category
      - quarter
      - month
      - customer_segment

  net_profit:
    name: Net Profit
    description: Revenue minus all costs (COGS, shipping, materials, advertising)
    formula: SUM(revenue) - SUM(cogs) - SUM(shipping_cost) - SUM(material_cost) - SUM(ad_spend)
    sql_expression: "(SUM(revenue) - SUM(cogs) - SUM(shipping_cost) - SUM(material_cost) - SUM(ad_spend))"
    format: currency
    governance: approved
    owner: Finance
    allowed_dimensions:
      - region
      - sub_region
      - product_category
      - quarter
      - month
      - sales_channel

dimensions:
  region:
    name: Region
    column: region
    values: ["North America", "Europe", "Asia-Pacific", "Latin America"]
  sub_region:
    name: Sub-Region
    column: sub_region
    values: ["US-East", "US-West", "EU-West", "EU-East", "EU-North", "APAC-South", "APAC-East", "LATAM-Central"]
  product_category:
    name: Product Category
    column: product_category
    values: ["Enterprise Software", "Cloud Infrastructure", "AI Hardware", "IoT Sensors", "Data Analytics"]
  quarter:
    name: Quarter
    column: quarter
    values: ["2024-Q1", "2024-Q2", "2024-Q3", "2024-Q4", "2025-Q1", "2025-Q2", "2025-Q3", "2025-Q4"]
  month:
    name: Month
    column: month
    values: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]
  sales_channel:
    name: Sales Channel
    column: sales_channel
    values: ["Direct Sales", "Partner Channel", "Online Self-Serve", "Reseller"]
  customer_segment:
    name: Customer Segment
    column: customer_segment
    values: ["Enterprise", "Mid-Market", "SMB", "Startup"]
